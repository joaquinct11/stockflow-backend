# ============================================================
# CONFIGURACIÓN BASE — STOCKFLOW BACKEND
# Se aplica a todos los entornos. Los perfiles (uat, prod)
# sobreescriben solo lo que necesitan.
# ============================================================

spring:
  application:
    name: Fluxus

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Lima

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: America/Lima
    date-format: yyyy-MM-dd'T'HH:mm:ss

# ── Servidor ─────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 10MB

# ── JWT ──────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: 900000        # 15 minutos
  refresh:
    expiration: 604800000   # 7 días

# ── CORS ─────────────────────────────────────────────────────
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://127.0.0.1:5173

# ── Logging ──────────────────────────────────────────────────
# Configuración completa en src/main/resources/logback-spring.xml
# (niveles, appenders y formato JSON por perfil)

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Webhook ──────────────────────────────────────────────────
webhook:
  max-retries: 3
  retry-delay-seconds: 5

# ── Email — Resend REST API ───────────────────────────────────
resend:
  api-key:    ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
  from-name:  ${RESEND_FROM_NAME}

# ── Culqi ────────────────────────────────────────────────────
culqi:
  secret-key:     ${CULQI_SECRET_KEY}
  public-key:     ${CULQI_PUBLIC_KEY}
  base-url:       https://api.culqi.com/v2
  plan-id-basico: ${CULQI_PLAN_ID_BASICO:}        # vacío hasta crear el plan con POST /api/culqi/admin/crear-plan
  precio-basico:  ${CULQI_PRECIO_BASICO:}
  rsa-public-key: ${CULQI_RSA_PUBLIC_KEY:}   # Culqi Panel → Desarrollo → RSA Keys → llave pública
  rsa-id:         ${CULQI_RSA_ID:}           # Culqi Panel → Desarrollo → RSA Keys → columna ID (UUID)

# ── App ──────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL}  # OBLIGATORIO: URL pública del frontend (ej: https://fluxus.pe)
