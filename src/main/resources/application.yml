# ============================================================
# CONFIGURACIÓN BASE — STOCKFLOW BACKEND
# Se aplica a todos los entornos. Los perfiles (uat, prod)
# sobreescriben solo lo que necesitan.
# ============================================================

spring:
  application:
    name: Fluxus

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Lima

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: America/Lima
    date-format: yyyy-MM-dd'T'HH:mm:ss

# ── Servidor ─────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api

# ── JWT ──────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: 900000        # 15 minutos
  refresh:
    expiration: 604800000   # 7 días

# ── CORS ─────────────────────────────────────────────────────
cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://127.0.0.1:5173

# ── Logging ──────────────────────────────────────────────────
# Configuración completa en src/main/resources/logback-spring.xml
# (niveles, appenders y formato JSON por perfil)

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── MercadoPago ──────────────────────────────────────────────
mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET}
  currency-id: ${MERCADOPAGO_CURRENCY_ID}
  checkout-base-url: ${MERCADOPAGO_BASE_URL}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL}
  success-url: ${MERCADOPAGO_SUCCESS_URL}
  failure-url: ${MERCADOPAGO_FAILURE_URL}
  pending-url: ${MERCADOPAGO_PENDING_URL}

# ── Webhook ──────────────────────────────────────────────────
webhook:
  max-retries: 3
  retry-delay-seconds: 5

# ── Email — Resend REST API ───────────────────────────────────
resend:
  api-key:    ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
  from-name:  ${RESEND_FROM_NAME}

# ── App ──────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
