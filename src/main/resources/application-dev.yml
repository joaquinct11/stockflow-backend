# ============================================================
# PERFIL DEV — solo sobreescribe lo que difiere del base
# ============================================================

fluxus:
  internal-api-key: dev-internal-key-change-in-prod

apisunat:
  base-url: https://sandbox.apisunat.pe  # Sandbox para desarrollo y UAT

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

  devtools:
    restart:
      enabled: true

server:
  error:
    include-message: always
    include-stacktrace: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true